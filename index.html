<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHUSXUW</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@200;300;600&display=swap');

        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            background: #f5f5f5;
            position: relative;
            cursor: default;
        }

        /* --- ПАРАЛЛАКС ПЕРЕМЕННЫЕ --- */
        :root {
            --px: 0px;
            --py: 0px;
        }

        /* --- АРТ-ФОН --- */
        
        body::before {
            content: "";
            position: fixed;
            inset: -50px; 
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0,0,0,.03) 1px, transparent 1px),
                radial-gradient(circle at 70% 40%, rgba(0,0,0,.02) 1px, transparent 1px);
            background-size: 4px 4px, 7px 7px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            transform: translate(calc(var(--px) * 0.2), calc(var(--py) * 0.2));
        }

        body::after {
            content: "";
            position: fixed;
            width: 1400px;
            height: 1400px;
            right: -500px;
            bottom: -300px;
            background: radial-gradient(
              ellipse at center,
              transparent 50%,
              rgba(0,0,0,.03) 52%,
              transparent 54%
            );
            pointer-events: none;
            z-index: 0;
            animation: driftWind 40s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes driftWind {
            0% { transform: rotate(-25deg) translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5)); }
            50% { transform: rotate(-23deg) translate(calc(var(--px) * 0.5 - 20px), calc(var(--py) * 0.5 + 20px)); }
            100% { transform: rotate(-25deg) translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5)); }
        }

        .background-x {
            position: fixed;
            right: -120px;
            top: -100px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 700px;
            color: #000;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            transform: translate(var(--px), var(--py));
            animation: breatheX 30s ease-in-out infinite;
        }

        @keyframes breatheX {
            0% { opacity: 0.02; }
            50% { opacity: 0.04; }
            100% { opacity: 0.02; }
        }

        .light-orb {
            position: fixed;
            width: 800px;
            height: 800px;
            right: -300px;
            top: -200px;
            background: radial-gradient(
                circle,
                rgba(255,255,255,1) 0%,
                rgba(255,255,255,.5) 25%,
                rgba(255,255,255,0) 70%
            );
            animation: floatLight 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatLight {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-50px, 40px); }
            100% { transform: translate(0, 0); }
        }

        .cursor-light {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: opacity 0.2s ease;
        }

        .memory-layer {
            position: absolute;
            top: 400px;
            left: 50px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.5rem;
            opacity: 0.04;
            transform: rotate(-4deg);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        /* --- ИНТЕРФЕЙС --- */
        
        .container { 
            width: 100%; 
            max-width: 450px; 
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative; 
            z-index: 10;
        }

        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; margin: 0; line-height: 1; }
        
        .meta-block { display: flex; flex-direction: column; gap: 4px; }
        .meta-text { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; letter-spacing: 0.05em; opacity: 0.6; text-transform: lowercase; }
        .day-counter { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; letter-spacing: 0.1em; opacity: 0.6; text-transform: uppercase; margin-top: 6px; }

        .now-block {
            font-size: 0.75rem; opacity: 0.5; line-height: 1.6; text-transform: lowercase;
            letter-spacing: 0.05em; display: flex; flex-direction: column;
        }
        .now-title { font-weight: 600; opacity: 0.8; margin-bottom: 2px; letter-spacing: 0.1em; text-transform: uppercase; }
        #now-content { outline: none; transition: opacity 0.3s; }
        #now-content:focus { opacity: 1; }
        
        .soundtrack-block { margin-top: 5px; display: flex; flex-direction: column; }
        #music-content { 
            font-size: 0.75rem; 
            font-style: italic; 
            outline: none; 
            transition: opacity 0.3s; 
        }
        #music-content:focus { opacity: 1; }

        #dynamic-phrase { 
            font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2rem; 
            opacity: 0.18; letter-spacing: 0.12em; text-transform: uppercase;
            height: 1.2em; transition: opacity 0.5s; 
        }

        textarea { 
            width: 100%; border: none; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 8px 0; 
            outline: none; font-size: 0.8rem; font-family: inherit; background: transparent; 
            transition: border-color 0.3s; resize: none; overflow: hidden; min-height: 30px; line-height: 1.4;
        }
        textarea:focus { border-bottom: 1px solid rgba(0,0,0,0.4); }
        
        .input-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
        #publish-btn {
            background: none; border: none; font-family: inherit; font-size: 0.65rem;
            letter-spacing: 0.1em; text-transform: lowercase; cursor: pointer;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #publish-btn.visible { opacity: 0.5; pointer-events: auto; }
        #publish-btn:hover { opacity: 1; }

        #current-note, .archive-text { white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
        #current-note { font-size: 0.85rem; font-weight: 300; border-left: 1px solid rgba(0,0,0,0.3); padding-left: 10px; margin-top: 10px; opacity: 0.7; }

        .footer-links { margin-top: 40px; display: flex; flex-direction: column; gap: 8px; }
        a.nav-link { text-decoration: none; color: #000; font-size: 0.65rem; letter-spacing: 0.1em; opacity: 0.3; text-transform: lowercase; transition: opacity 0.3s ease; width: max-content; }
        a.nav-link:hover { opacity: 0.8; }
        
        .footer-info { position: fixed; bottom: 40px; left: 30px; font-size: 10px; opacity: 0.18; letter-spacing: 0.1em; text-transform: lowercase; z-index: 10; }
        
        #archive-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fdfdfd; z-index: 100; padding: 40px; overflow-y: auto; }
        .archive-controls { display: flex; gap: 20px; margin-bottom: 30px; }
        .archive-controls button { background:none; border:none; cursor:pointer; font-size: 0.7rem; text-transform: lowercase; opacity: 0.5; transition: opacity 0.3s; padding: 0; }
        .archive-controls button:hover { opacity: 1; }
        .archive-item { margin-bottom: 25px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 15px; }
        .archive-date { font-size: 0.65rem; opacity: 0.4; margin-bottom: 5px; letter-spacing: 0.1em; }
        .archive-text { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; opacity: 0.8; }

        /* --- ТАЙНА (NORTH) --- */
        #secret-north {
            position: fixed;
            top: 75%;
            right: 15%;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: lowercase;
            opacity: 0.02;
            cursor: pointer;
            z-index: 50;
            transition: opacity 0.5s ease;
        }
        #secret-north:hover { opacity: 0.06; }

        #north-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #f5f5f5;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 2s ease;
            cursor: pointer;
        }
        #north-screen span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="background-x">X</div>
<div class="light-orb"></div>
<div class="cursor-light"></div>
<div class="memory-layer" id="memory-layer"></div>

<div id="secret-north">north</div>
<div id="north-screen"><span>keep going.</span></div>

<div class="container">
    <h1>XHUSXUW</h1>
    
    <div class="meta-block">
        <div class="meta-text">16 y.o.</div>
        <div class="meta-text">summer study system</div>
        <div class="day-counter" id="day-counter">DAY 0</div>
    </div>
    
    <div class="now-block">
        <span class="now-title">NOW</span>
        <div id="now-content" contenteditable="true" spellcheck="false">studying history<br>reading crime and punishment<br>listening to salem<br>building discipline</div>
        
        <div class="soundtrack-block">
            <span class="now-title" style="margin-top: 10px;">THIS WEEK</span>
            <div id="music-content" contenteditable="true" spellcheck="false">Sorbet — Soda Lava</div>
        </div>
    </div>

    <div id="dynamic-phrase">Excelsior</div>

    <div>
        <textarea id="journal-input" placeholder="write your current thought..." rows="1"></textarea>
        <div class="input-actions">
            <button id="publish-btn">[publish]</button>
        </div>
        <div id="current-note"></div>
    </div>

    <div class="footer-links">
        <a href="https://t.me/xhusxuw" target="_blank" class="nav-link">telegram</a>
        <a href="#" id="open-archive" class="nav-link">archive</a>
    </div>
</div>

<div class="footer-info">
    27.04<br>
    56°48′48″ n, 53°12′42″ e
</div>

<div id="archive-modal">
    <div class="archive-controls">
        <button onclick="document.getElementById('archive-modal').style.display='none'">[close]</button>
        <button id="clear-archive" style="color: #888;">[clear archive]</button>
    </div>
    <div id="archive-list"></div>
</div>

<script>
    // Параллакс
    document.addEventListener('mousemove', (e) => {
        const px = (e.clientX / window.innerWidth - 0.5) * 40 + 'px';
        const py = (e.clientY / window.innerHeight - 0.5) * 40 + 'px';
        document.documentElement.style.setProperty('--px', px);
        document.documentElement.style.setProperty('--py', py);
    });

    // Курсор света
    const cursor = document.querySelector('.cursor-light');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    // Секретный экран NORTH
    const northBtn = document.getElementById('secret-north');
    const northScreen = document.getElementById('north-screen');
    
    northBtn.addEventListener('click', () => {
        northScreen.style.display = 'flex';
        setTimeout(() => northScreen.style.opacity = 1, 50);
    });

    northScreen.addEventListener('click', () => {
        northScreen.style.opacity = 0;
        setTimeout(() => northScreen.style.display = 'none', 2000);
    });

    // Счётчик дней
    const startDate = new Date('2026-06-01T00:00:00');
    const today = new Date();
    const diffTime = Math.abs(today - startDate);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
    document.getElementById('day-counter').textContent = `DAY ${diffDays}`;

    // Динамическая фраза
    const phrases = ["Excelsior", "Perfer et procede", "Ad meliora", "Semper sursum", "Non satis"];
    let i = 0;
    const phraseEl = document.getElementById('dynamic-phrase');
    setInterval(() => {
        phraseEl.style.opacity = 0;
        setTimeout(() => { 
            i = (i + 1) % phrases.length; 
            phraseEl.textContent = phrases[i]; 
            phraseEl.style.opacity = 0.18; 
        }, 500);
    }, 4000);

    // Блок NOW
    const nowContent = document.getElementById('now-content');
    if(localStorage.getItem('nowBlock')) {
        nowContent.innerHTML = localStorage.getItem('nowBlock');
    }
    nowContent.addEventListener('input', () => {
        localStorage.setItem('nowBlock', nowContent.innerHTML);
    });

    // Блок MUSIC
    const musicContent = document.getElementById('music-content');
    if(localStorage.getItem('musicBlock')) {
        musicContent.innerHTML = localStorage.getItem('musicBlock');
    }
    musicContent.addEventListener('input', () => {
        localStorage.setItem('musicBlock', musicContent.innerHTML);
    });

    // Дневник и архив
    const input = document.getElementById('journal-input');
    const currentNote = document.getElementById('current-note');
    const publishBtn = document.getElementById('publish-btn');
    
    input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
        if (this.value.trim() !== '') publishBtn.classList.add('visible');
        else publishBtn.classList.remove('visible');
    });

    function getArchive() {
        let arch = JSON.parse(localStorage.getItem('myArchive') || '[]');
        return arch.map(item => {
            if (typeof item === 'string') return { text: item, date: 'unknown date' };
            return item;
        });
    }

    const archiveForMemory = getArchive();
    if (archiveForMemory.length > 0) {
        const randomNote = archiveForMemory[Math.floor(Math.random() * archiveForMemory.length)];
        let text = randomNote.text;
        if (text.length > 40) text = text.substring(0, 40) + '...';
        document.getElementById('memory-layer').textContent = text;
    }

    function saveNote() {
        if (!input.value.trim()) return;
        let archive = getArchive();
        let current = localStorage.getItem('currentNoteObj');
        
        if(current) archive.unshift(JSON.parse(current));
        else if (localStorage.getItem('currentNote')) archive.unshift({ text: localStorage.getItem('currentNote'), date: 'unknown date' });
        
        const todayStr = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const newNoteObj = { text: input.value.trim(), date: todayStr };

        localStorage.setItem('myArchive', JSON.stringify(archive));
        localStorage.setItem('currentNoteObj', JSON.stringify(newNoteObj));
        localStorage.setItem('currentNote', newNoteObj.text); 
        
        input.value = "";
        input.style.height = 'auto'; 
        publishBtn.classList.remove('visible'); 
        render();
    }

    publishBtn.addEventListener('click', saveNote);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveNote();
    });

    function render() {
        let current = localStorage.getItem('currentNoteObj');
        if (current) currentNote.textContent = JSON.parse(current).text;
        else currentNote.textContent = localStorage.getItem('currentNote') || "";
    }

    document.getElementById('open-archive').onclick = (e) => {
        e.preventDefault();
        const arch = getArchive();
        document.getElementById('archive-list').innerHTML = arch.map(t => `
            <div class="archive-item">
                <div class="archive-date">${t.date}</div>
                <div class="archive-text">${t.text}</div>
            </div>
        `).join('');
        document.getElementById('archive-modal').style.display = 'block';
    };

    // Исправленная логика очистки
    document.getElementById('clear-archive').onclick = () => {
        if(confirm('Ты уверен, что хочешь полностью стереть архив?')) {
            localStorage.removeItem('myArchive');
            localStorage.removeItem('currentNoteObj');
            localStorage.removeItem('currentNote');
            document.getElementById('archive-list').innerHTML = '';
            document.getElementById('memory-layer').textContent = '';
            document.getElementById('current-note').textContent = '';
            document.getElementById('archive-modal').style.display = 'none';
            render();
        }
    };
    
    render();
</script>
</body>
</html>
